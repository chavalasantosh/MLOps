name: diabetes-mlops
services:
  diabetes-api:
    image: ${DIABETES_IMAGE:-diabetes-bentoml:v1}
    pull_policy: never
    ports:
      - "127.0.0.1:${DIABETES_PORT:-3001}:3000"
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/readyz', timeout=5)"]
      interval: 10s
      timeout: 8s
      retries: 6
      start_period: 60s
